<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Health</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <style>
      .health-main { max-width: 760px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
      .health-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
      .health-card h2 { margin: 0 0 10px; font-size: 16px; }
      .health-banner { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--vacant); flex: none; }
      .dot.bad { background: var(--occupied); }
      .health-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
      .muted { color: var(--muted); }
      .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
      .kv dt { color: var(--muted); }
      .kv dd { margin: 0; overflow-wrap: anywhere; }
      code { background: var(--panel-alt); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
      .alert-row { border-top: 1px solid var(--line); padding: 8px 0; }
      .alert-row:first-child { border-top: none; }
      .alert-time { color: var(--muted); font-size: 12px; }
      #testResult { margin-left: 10px; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>System Health</h1>
        <p>Alerts, cameras, internet, disk and backups</p>
      </div>
      <div class="topbar-actions">
        <button type="button" id="themeToggleButton" class="theme-toggle-button" title="Switch to dark mode" aria-pressed="false">&#127769;</button>
        <a class="nav-link" href="/">Cameras</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
      </div>
    </header>
    <main class="health-main">
      <section class="health-card">
        <div class="health-banner"><span id="overallDot" class="dot"></span><span id="overallText">Loading…</span></div>
        <ul id="problemList" class="health-list" style="margin-top:10px"></ul>
      </section>

      <section class="health-card">
        <h2>Where alerts go</h2>
        <div id="channels"></div>
        <p style="margin:12px 0 0">
          <button type="button" id="testButton">Send test alert</button>
          <span id="testResult" class="muted"></span>
        </p>
      </section>

      <section class="health-card">
        <h2>Status</h2>
        <dl class="kv" id="statusList"></dl>
      </section>

      <section class="health-card">
        <h2>Recent alerts</h2>
        <div id="alertList" class="muted">None yet.</div>
      </section>
    </main>
    <script>
      function el(tag, text, cls) {
        var node = document.createElement(tag);
        if (text != null) node.textContent = text;
        if (cls) node.className = cls;
        return node;
      }
      function when(iso) {
        if (!iso) return "—";
        return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      }
      function render(h) {
        var problems = h.problems || [];
        document.getElementById("overallDot").className = problems.length ? "dot bad" : "dot";
        document.getElementById("overallText").textContent = problems.length
          ? problems.length + (problems.length === 1 ? " problem right now" : " problems right now")
          : "Everything is working";
        var list = document.getElementById("problemList");
        list.replaceChildren();
        problems.forEach(function (p) { list.appendChild(el("li", p.title + " (since " + when(p.since) + ")")); });

        var ch = document.getElementById("channels");
        ch.replaceChildren();
        if ((h.alert_channels || []).indexOf("push") >= 0) {
          var p1 = el("p", null); p1.style.margin = "0 0 6px";
          p1.append("Phone: install the free ntfy app, tap +, and subscribe to ");
          p1.appendChild(el("code", h.ntfy_topic));
          p1.append(". Keep this name private: anyone who has it can read your alerts.");
          ch.appendChild(p1);
        } else {
          ch.appendChild(el("p", "Phone alerts are off (no ntfy_topic in data/alerts.json).", "muted"));
        }
        ch.appendChild(el("p", (h.alert_channels || []).indexOf("email") >= 0
          ? "Email: on." : "Email: off (optional; set it up in data/alerts.json).", "muted"));
        ch.appendChild(el("p", h.heartbeat_configured
          ? "Outside watchdog: on. You'll be told even if this computer loses power or internet."
          : "Outside watchdog: off. Add a heartbeat_url (e.g. from healthchecks.io) to be told about power or internet outages while they're happening.",
          "muted"));
        if (h.config_error) ch.appendChild(el("p", "Settings problem: " + h.config_error));

        var s = document.getElementById("statusList");
        s.replaceChildren();
        var rows = [
          ["Running since", when(h.started_at)],
          ["Internet", h.internet_online == null ? "Checking…" : (h.internet_online ? "Connected" : "Down (alerts will send when it's back)")],
          ["Alerts waiting to send", String(h.alerts_waiting_to_send)],
          ["Disk", h.disk.percent_used + "% full, " + h.disk.free_gb + " GB free"],
          ["Database", h.disk.database_mb + " MB"],
          ["Last backup", h.last_backup || "None yet (runs nightly)"],
        ];
        if (h.last_send_error) rows.push(["Last send error", h.last_send_error]);
        rows.forEach(function (r) { s.appendChild(el("dt", r[0])); s.appendChild(el("dd", r[1])); });

        var a = document.getElementById("alertList");
        a.replaceChildren();
        if (!(h.recent_alerts || []).length) { a.textContent = "None yet."; a.className = "muted"; return; }
        a.className = "";
        h.recent_alerts.forEach(function (al) {
          var row = el("div", null, "alert-row");
          row.appendChild(el("div", when(al.created_at), "alert-time"));
          row.appendChild(el("strong", al.title));
          row.appendChild(el("div", al.message));
          a.appendChild(row);
        });
      }
      function refresh() {
        fetch("/api/health").then(function (r) { return r.json(); }).then(render).catch(function () {
          document.getElementById("overallDot").className = "dot bad";
          document.getElementById("overallText").textContent = "Can't reach the monitoring program";
        });
      }
      document.getElementById("testButton").addEventListener("click", function () {
        var out = document.getElementById("testResult");
        out.textContent = "Sending…";
        fetch("/api/health/test-alert", { method: "POST" }).then(function (r) { return r.json(); }).then(function (res) {
          out.textContent = res.channels.length ? "Sent. Check your phone in a few seconds." : "Logged, but no alert channel is set up.";
          setTimeout(refresh, 3000);
        }).catch(function () { out.textContent = "Couldn't send."; });
      });
      refresh();
      setInterval(refresh, 10000);
    </script>
    <script src="/static/theme.js"></script>
  </body>
</html>
